name: TJ SPACE System 14 Presence
on:
  push:
    paths: ["TJ_SPACE/Presence/**","TJ_SPACE/CI/test_avatar_presence.py"]
  pull_request:
    paths: ["TJ_SPACE/Presence/**","TJ_SPACE/CI/test_avatar_presence.py"]
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: pytest -q TJ_SPACE/CI/test_avatar_presence.py
